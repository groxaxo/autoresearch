search_space:
  lr: [5.0e-5, 1.0e-4, 1.5e-4, 2.0e-4, 3.0e-4]
  lora_r: [8, 16, 32, 64]
  lora_alpha: [16, 32, 64, 128]
  lora_dropout: [0.0, 0.05, 0.1]
  max_seq_length: [1024, 2048, 4096]
  per_device_train_batch_size: [1, 2, 4]
  gradient_accumulation_steps: [4, 8, 16, 32]
  packing: [true, false]
  warmup_ratio: [0.03, 0.05, 0.1]
  weight_decay: [0.0, 0.01, 0.05]
  reasoning_ratio: [0.0, 0.15, 0.3, 0.5, 0.7]
  target_modules_set:
    - qkv_omlp
    - attn_only
    - mlp_only

constraints:
  max_micro_tokens: 8192
  max_step_tokens: 131072
  max_runtime_minutes: 20
  min_runtime_minutes: 12
  require_safe_vram_estimate: true

dataset_mix_options:
  default:
    sft_general: 0.6
    reasoning: 0.2
    format: 0.2
  reasoning_heavy:
    sft_general: 0.10
    reasoning: 0.75
    format: 0.15
  format_heavy:
    sft_general: 0.40
    reasoning: 0.10
    format: 0.50
